<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>[必填] 英搏尔品牌演示</title>
<style>
:root{--brand-blue:#005687;--brand-red:#e10600;--ink:#000;--grey:#97999b;--paper:#fff;--sans:"Microsoft YaHei UI","Microsoft YaHei",Arial,sans-serif}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;font-family:var(--sans);color:var(--ink)}
#deck{display:flex;width:100%;height:100%;transition:transform .55s cubic-bezier(.22,.7,.2,1)}
.slide{position:relative;flex:0 0 100vw;width:100vw;height:100vh;overflow:hidden;background:var(--paper)}
.brand-cover{background:linear-gradient(90deg,rgba(255,255,255,.98) 0%,rgba(255,255,255,.88) 28%,rgba(255,255,255,.2) 62%,rgba(255,255,255,0) 100%),url("empower/sky-bg.png") center/cover no-repeat}
.brand-cover .campus{position:absolute;right:0;bottom:0;width:66vw;height:auto;z-index:1}.brand-cover .brand-logo{position:absolute;left:5.2vw;top:6.2vh;width:min(21vw,390px);height:auto;z-index:3}
.cover-copy{position:absolute;left:6.2vw;top:28vh;z-index:4;width:46vw}.eyebrow{display:flex;align-items:center;gap:1vw;color:var(--brand-blue);font-family:Arial,sans-serif;font-size:max(14px,1vw);font-weight:700;letter-spacing:.15em;text-transform:uppercase}.eyebrow:before{content:"";width:3.2vw;height:4px;background:var(--brand-red)}
.cover-title{margin:2.8vh 0 0;font-size:min(5.6vw,10vh);line-height:1.08;font-weight:700;letter-spacing:-.04em;color:var(--brand-blue)}.cover-subtitle{margin:2.2vh 0 0;font-size:max(20px,1.5vw);line-height:1.55;font-weight:400;color:#222;max-width:38vw}.cover-meta{display:flex;gap:1.4vw;align-items:center;margin-top:5vh;font:500 max(13px,.86vw)/1.2 Arial,var(--sans);color:#666;text-transform:uppercase;letter-spacing:.08em}.cover-meta i{width:5px;height:5px;background:var(--brand-red);display:block}
.brand-bar{position:absolute;left:0;bottom:0;width:100%;height:6px;background:linear-gradient(90deg,var(--brand-blue) 0 72%,var(--brand-red) 72%);z-index:5}
.content{padding:6vh 5vw 5vh}.content-logo{position:absolute;right:5vw;top:4.5vh;width:14vw;max-width:260px}.content-rule{position:absolute;left:3.4vw;right:13vw;top:10.4vh;height:2px;background:linear-gradient(90deg,var(--brand-blue),rgba(0,86,135,.05))}.content-title{margin:8vh 0 0;font-size:min(3.2vw,5.8vh);font-weight:700;color:#111}.content-body{margin-top:6vh;font-size:max(18px,1.15vw);line-height:1.75;color:#333}.footer{position:absolute;left:3.4vw;right:3.4vw;bottom:2vh;border-top:1px solid #ddd;padding-top:1vh;text-align:center;color:#aaa;font-size:12px}
#nav{position:fixed;right:2vw;bottom:2vh;z-index:20;display:flex;gap:7px}.dot{width:7px;height:7px;border-radius:50%;background:rgba(0,86,135,.28)}.dot.on{background:var(--brand-red)}#hint{position:fixed;left:2vw;bottom:2vh;z-index:20;color:rgba(0,86,135,.55);font:11px Arial,sans-serif;letter-spacing:.08em}
@media(max-aspect-ratio:4/3){.cover-copy{width:58vw}.cover-subtitle{max-width:52vw}.brand-cover .campus{width:76vw}}
</style>
</head>
<body>
<div id="hint">← → 翻页</div>
<main id="deck">
<!-- SLIDES_HERE -->
</main>
<div id="nav"></div>
<script>
const deck=document.querySelector('#deck'),slides=[...document.querySelectorAll('.slide')],nav=document.querySelector('#nav');let current=0;slides.forEach((_,i)=>{const d=document.createElement('span');d.className='dot';d.onclick=()=>go(i);nav.appendChild(d)});function go(i){current=Math.max(0,Math.min(slides.length-1,i));deck.style.transform=`translateX(${-current*100}vw)`;[...nav.children].forEach((d,n)=>d.classList.toggle('on',n===current))}go(0);addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key))go(current+1);if(['ArrowLeft','PageUp'].includes(e.key))go(current-1)});
</script>
</body>
</html>
